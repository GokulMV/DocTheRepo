# Deploy DocTheRepo Hub to nonlive, then promote the same image to production.
#
# Copy this file to .github/workflows/ in your infrastructure repository, with deploy/environments/ next to it.
# It assumes Kubernetes + Helm with the chart vendored at charts/dth (copy deploy/helm/dth from the release you
# run); the same shape works for the Terraform modules (replace the helm step with
# `terraform apply -var-file=deploy/environments/<env>/terraform.tfvars -var image=<repo>@<digest>`).
#
# Copy deploy-hub-env.yml next to it: each environment runs the same steps there (preflight, cloud login,
# settings and secrets check, cluster secrets, deploy, smoke test).
#
# Set up once, in the repository's Settings → Environments (the full list is at the top of deploy-hub-env.yml
# and in docs/environments.md, "Deploying from GitHub"):
#   nonlive     variables DEPLOY_ROLE_ARN, AWS_REGION, EKS_CLUSTER, HUB_URL; no reviewers
#   production  its own values of the same variables (another account or cluster), plus "Required reviewers"
#               (who may promote) and "Deployment branches: main"
# Repository variable HUB_IMAGE: the image to deploy when the input is empty.
# The cloud login uses GitHub's OIDC token, trusted per environment by each cloud role, so the nonlive job can
# never reach production. Who owns each Hub is in deploy/environments/<env>/settings.yaml, reviewed like code;
# no password is ever created or printed.
name: deploy-hub

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Hub image to deploy (tag or @sha256 digest), e.g. ghcr.io/gokulmv/doctherepo-hub:v1.8.0"
        required: true
  push:
    branches: [main]
    paths: ["deploy/environments/**"]   # a settings change is deployed like a release

permissions:
  contents: read
  id-token: write     # OIDC login to the cloud

concurrency:
  group: deploy-hub
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.pin.outputs.repo }}
      digest: ${{ steps.pin.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin the image to a digest (production gets exactly what nonlive tested)
        id: pin
        env:
          REQUESTED: ${{ inputs.image || vars.HUB_IMAGE }}
        run: |
          set -euo pipefail
          test -n "$REQUESTED" || { echo "set the HUB_IMAGE repository variable or pass the image input"; exit 1; }
          repo="${REQUESTED%@*}"
          case "${repo##*/}" in *:*) repo="${repo%:*}" ;; esac   # drop the tag, keep a registry port
          digest=$(docker buildx imagetools inspect "$REQUESTED" --format '{{json .Manifest}}' | jq -r .digest)
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  nonlive:
    needs: resolve
    uses: ./.github/workflows/deploy-hub-env.yml
    with: { environment: nonlive, repo: "${{ needs.resolve.outputs.repo }}", digest: "${{ needs.resolve.outputs.digest }}" }
    secrets: inherit

  production:
    needs: [resolve, nonlive]   # the production environment's required reviewers approve this job
    uses: ./.github/workflows/deploy-hub-env.yml
    with: { environment: production, repo: "${{ needs.resolve.outputs.repo }}", digest: "${{ needs.resolve.outputs.digest }}" }
    secrets: inherit
