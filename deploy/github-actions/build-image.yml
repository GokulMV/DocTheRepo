# Build the Hub's container image and publish it to your GitHub Container Registry (ghcr.io).
#
# Copy this file to .github/workflows/ in your fork or copy of the DocTheRepo repository. Then either push a
# tag (git tag v1.0.0 && git push origin v1.0.0) or run it from the Actions tab. The image is published as
#   ghcr.io/<your GitHub user or organization>/doctherepo-hub:<tag>
# and its digest is printed in the run summary. deploy-hub.yml deploys it.
name: build-hub-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. v1.0.0"
        required: true

permissions:
  contents: read
  packages: write   # publish to ghcr.io with the workflow's own token; no secret to create

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the image
        id: name
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/doctherepo-hub" >> "$GITHUB_OUTPUT"   # registry names are lowercase
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: VERSION=${{ steps.name.outputs.tag }}
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
          push: true
      - name: Summary
        run: |
          echo "Published \`${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
