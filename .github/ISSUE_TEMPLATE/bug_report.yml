name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. **Security problems go to [private reporting](https://github.com/GokulMV/DocTheRepo/security/advisories/new), not here.**"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
  - type: textarea
    id: details
    attributes:
      label: Error details
      description: If the UI showed an error card, paste its "Details for a bug report". Otherwise, relevant hub log lines. Remove any secrets.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: "`dth --version`, the hub's start-up log line, or the commit"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it
      options: [quickstart.sh, dth up (Docker Compose), Helm, Terraform (AWS), Terraform (GCP), Other]
  - type: input
    id: browser
    attributes:
      label: Browser and OS (for UI issues)
