name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: typecheck and unit tests
        run: make web-test
      - name: build
        run: cd web && npm run build
      - name: npm audit (production dependencies)
        run: cd web && npm audit --omit=dev --audit-level=high

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: sqlc generated code is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code -- internal/store/gen
      - name: lint
        run: make lint
      - name: test (unit + integration with testcontainers)
        run: make test
      - name: build
        run: make build
      - name: govulncheck
        run: make vuln
      - name: dth CLI builds for every release platform (pure Go)
        run: make cli-release

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: dth-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: binaries run on the distroless base
        run: |
          docker run --rm --entrypoint /dth dth-hub:ci --version
          ! docker run --rm dth-hub:ci healthcheck   # nothing listening: must exit non-zero, not crash

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: terraform fmt/validate + helm lint
        run: make deploy-lint

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            test/e2e/package-lock.json
      - name: hub with the UI
        run: make release
      - name: Playwright browsers
        run: cd test/e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: E2E (cold start, RBAC, spend block)
        run: cd test/e2e && npx playwright test
        env:
          CI: "1"
      - uses: grafana/setup-k6-action@v1
      - name: k6 scripts parse (the runs themselves are manual; see docs/perf-results.md)
        run: k6 inspect test/perf/push-burst.js >/dev/null && k6 inspect test/perf/qa.js >/dev/null
      - name: report and hub log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test/e2e/playwright-report
            test/e2e/test-results
            test/e2e/.stack/hub.log
