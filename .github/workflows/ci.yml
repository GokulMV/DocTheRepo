name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: typecheck and unit tests
        run: make web-test
      - name: build
        run: cd web && npm run build
      - name: npm audit (runtime and build dependencies, high/critical fail)
        run: make audit

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: sqlc generated code is up to date
        run: |
          GOTOOLCHAIN=auto go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/store/gen
      - name: lint
        run: make lint
      - name: test (unit + integration with testcontainers)
        run: make test
      - name: build
        run: make build
      - name: govulncheck (shipped binaries)
        run: make vuln
      - name: dth CLI builds for every release platform (pure Go)
        run: make cli-release

  seal-interop:
    # The browser seals a value to a key made for this run; the Go side must open it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: seal in the browser code
        run: cd web && npm ci && SEAL_VECTOR_DIR="$RUNNER_TEMP/seal" npx vitest run tests/seal.test.ts
      - name: open it in Go
        run: SEAL_VECTOR_DIR="$RUNNER_TEMP/seal" go test ./internal/secrets -run TestUnsealsWhatTheBrowserSealed -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: dth-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fixable HIGH/CRITICAL fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dth-hub:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: image SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dth-hub:ci
          format: cyclonedx
          output: sbom-image.cdx.json
          scan-type: image
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-image
          path: sbom-image.cdx.json
      - name: binaries run on the distroless base
        run: |
          docker run --rm --entrypoint /dth dth-hub:ci --version
          ! docker run --rm dth-hub:ci healthcheck   # nothing listening: must exit non-zero, not crash

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: CycloneDX SBOMs (hub, CLI, UI)
        run: cd web && npm ci --no-audit --no-fund && cd .. && make sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: terraform fmt/validate + helm lint
        run: make deploy-lint

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            test/e2e/package-lock.json
      - name: hub with the UI
        run: make release
      - name: Playwright browsers
        run: cd test/e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: E2E (cold start, RBAC, spend block)
        run: cd test/e2e && npx playwright test
        env:
          CI: "1"
      - uses: grafana/setup-k6-action@v1
      - name: "k6 scripts parse (the runs themselves are manual: make perf-push, perf-qa, perf-signals)"
        run: k6 inspect test/perf/push-burst.js >/dev/null && k6 inspect test/perf/qa.js >/dev/null
      - name: report and hub log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test/e2e/playwright-report
            test/e2e/test-results
            test/e2e/.stack/hub.log
