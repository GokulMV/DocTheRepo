name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: typecheck and unit tests
        run: make web-test
      - name: build
        run: cd web && npm run build
      - name: npm audit (production dependencies)
        run: cd web && npm audit --omit=dev --audit-level=high

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: sqlc generated code is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code -- internal/store/gen
      - name: lint
        run: make lint
      - name: test (unit + integration with testcontainers)
        run: make test
      - name: build
        run: make build
      - name: govulncheck
        run: make vuln
